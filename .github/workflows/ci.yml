name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # DryAge composite-builds against ../SmokeHouse, which composite-builds against
      # ../SuperBeefSort, which composite-builds against ../CSRBT — all four repos are
      # checked out as siblings and Gradle runs from the DryAge subdirectory.
      - name: Check out DryAge
        uses: actions/checkout@v4
        with:
          path: DryAge

      - name: Check out SmokeHouse (sibling, for the composite build)
        uses: actions/checkout@v4
        with:
          repository: RicheyWorks/SmokeHouse
          path: SmokeHouse

      - name: Check out SuperBeefSort (sibling, nested composite)
        uses: actions/checkout@v4
        with:
          repository: RicheyWorks/SuperBeefSort
          path: SuperBeefSort

      - name: Check out CSRBT (sibling, nested composite)
        uses: actions/checkout@v4
        with:
          repository: RicheyWorks/CSRBT
          path: CSRBT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        working-directory: DryAge
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
